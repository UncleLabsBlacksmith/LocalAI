<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local AI Chat • Ollama</title>
<style>
:root{color-scheme:dark;--bg:#202123;--side:#151617;--panel:#2c2d30;--line:#414348;--text:#f0f0f0;--muted:#a7a7aa;--accent:#21c482;--red:#eb747c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,'Segoe UI',Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}.app{display:flex;height:100dvh;min-height:430px}.sidebar{width:272px;flex:none;background:var(--side);border-right:1px solid #2d2d2d;display:flex;flex-direction:column;padding:18px 12px;gap:12px}.brand{font-weight:800;letter-spacing:.09em;padding:3px 9px 8px}.brand span{color:var(--accent)}.button{background:var(--panel);border:1px solid #424348;border-radius:10px;color:var(--text);padding:10px 12px}.button:hover{background:#3a3c3e}.primary{background:var(--accent);color:#092b1d;border:0;font-weight:700}.primary:hover{background:#35d793}.sectionlabel{font-size:12px;color:var(--muted);margin:2px 6px -6px}.field{width:100%;border:1px solid #4b4c50;border-radius:9px;background:#28292b;color:white;padding:10px;outline:none;min-width:0}.field:focus,textarea:focus{border-color:var(--accent)}.history{flex:1;min-height:0;overflow:auto}.historyitem{display:flex;align-items:center;gap:4px;margin:3px 0;border-radius:8px}.historyitem.active{background:#303134}.historyitem>button:first-child{min-width:0;flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:transparent;border:0;color:var(--text);padding:10px}.iconbtn{background:transparent;border:0;color:var(--muted);border-radius:7px;padding:8px}.iconbtn:hover{color:white;background:#444}.sidebarfooter{font-size:12px;color:var(--muted);border-top:1px solid #303033;padding:12px 6px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777;margin-right:6px}.dot.ok{background:var(--accent)}.dot.bad{background:var(--red)}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:66px;flex:none;border-bottom:1px solid #36373b;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:12px}.top h1{font-size:17px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}.topactions{display:flex;gap:8px;flex-wrap:wrap}.topactions .button{font-size:13px;padding:7px 10px}.messages{flex:1;overflow-y:auto;padding:22px max(18px,calc((100% - 850px)/2)) 28px;overscroll-behavior:contain}.empty{height:100%;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted)}.empty h2{font-size:28px;color:var(--text);margin:0 0 6px}.message{margin:0 0 25px}.messageheader{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:13px;font-weight:750;color:var(--accent)}.message.user .messageheader{color:#a2dafa}.content{font-size:15px;white-space:normal;overflow-wrap:anywhere;line-height:1.7}.message.user .content{display:inline-block;max-width:100%;padding:11px 15px;border-radius:14px;background:#30353a;white-space:pre-wrap}.content p{margin:.4em 0 .8em}.content h2,.content h3{margin:12px 0 6px}.content h2{font-size:21px}.content h3{font-size:17px}.content ul,.content ol{margin:8px 0;padding-left:24px}.content a{color:#8ad3ff}.content pre{background:#111315;border:1px solid #36383b;border-radius:10px;padding:14px;overflow-x:auto;white-space:pre;font:13px/1.6 Consolas,monospace}.content code{font:13px Consolas,monospace;background:#38393c;border-radius:4px;padding:2px 4px}.content pre code{background:transparent;padding:0}.content blockquote{border-left:3px solid #61646a;margin:12px 0;padding:3px 12px;color:#c9c9ce}.thought{border:1px solid #414247;border-radius:9px;margin:7px 0 12px;color:#b2b5b7;padding:8px 12px;font-size:13px}.thought summary{cursor:pointer}.thought pre{white-space:pre-wrap;font:inherit}.meta{font-size:12px;color:var(--muted);margin-top:8px}.messageactions{display:flex;gap:8px;margin-top:7px}.messageactions button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:3px}.messageactions button:hover{color:white}.composerwrap{padding:12px max(18px,calc((100% - 850px)/2)) 16px;border-top:1px solid #343538}.composer{display:flex;background:#2e3032;border:1px solid #505257;border-radius:14px;padding:9px;gap:9px;align-items:flex-end}.composer textarea{resize:none;flex:1;min-width:0;max-height:190px;min-height:58px;border:0;background:transparent;color:white;outline:none;padding:9px;overflow:auto}.composer button{min-width:76px}.hint{text-align:center;font-size:12px;color:var(--muted);padding-top:7px}.settings{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:10}.settings[hidden]{display:none}.modal{background:#252628;border:1px solid #515257;border-radius:14px;padding:22px;width:min(520px,100%);max-height:90dvh;overflow:auto;box-shadow:0 20px 60px #0008}.modal h2{margin:0 0 18px}.modal label{display:block;font-size:13px;color:#d0d0d2;margin:12px 0 5px}.modal textarea{min-height:110px;resize:vertical}.check{display:flex!important;gap:9px;align-items:center}.check input{accent-color:var(--accent)}.modalfooter{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.muted{color:var(--muted)}.notice{font-size:12px;color:#c6c9cb;margin:9px 2px}.mobilemenu{display:none}@media(max-width:720px){.sidebar{position:absolute;z-index:5;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;box-shadow:15px 0 40px #0005}.sidebar.show{transform:none}.mobilemenu{display:inline-flex}.top{padding:0 12px}.topactions .button{padding:6px;font-size:12px}.messages{padding:20px 14px}.composerwrap{padding:10px 12px 14px}.hint{font-size:10px}} 
</style>
</head>
<body>
<div class="app">
 <aside class="sidebar" id="sidebar">
  <div class="brand">● LOCAL <span>AI</span> CHAT</div>
  <button class="button" id="newChat">＋ แชตใหม่</button>
  <div class="sectionlabel">โมเดลใน Ollama</div>
  <select id="modelSelect" class="field"><option value="">กำลังโหลด...</option></select>
  <button class="button" id="refreshModels">↻ โหลดรายชื่อโมเดลใหม่</button>
  <div class="sectionlabel">ค้นหาประวัติ</div>
  <input class="field" id="search" placeholder="ค้นหาชื่อหรือข้อความ">
  <div class="history" id="history"></div>
  <div class="sidebarfooter"><div><span class="dot" id="statusDot"></span><span id="connection">กำลังตรวจสอบ...</span></div><button class="iconbtn" id="settingsBtn" title="ตั้งค่า">⚙ ตั้งค่า</button></div>
 </aside>
 <main class="main">
  <header class="top"><div style="display:flex;gap:10px;align-items:center;min-width:0"><button class="button mobilemenu" id="mobileMenu">☰</button><h1 id="chatTitle">แชตใหม่</h1></div><div class="topactions"><button class="button" id="retry">↻ ตอบใหม่</button><button class="button" id="export">↓ .md</button></div></header>
  <div id="messages" class="messages" aria-live="polite"></div>
  <div class="composerwrap"><div class="composer"><textarea id="prompt" rows="2" placeholder="ถามอะไรก็ได้... (Enter เพื่อส่ง)" aria-label="ข้อความถึง AI"></textarea><button class="button primary" id="send">ส่ง ↑</button></div><div class="hint" id="statusText">Enter ส่ง • Shift+Enter ขึ้นบรรทัด • Esc หยุด • ทุกอย่างประมวลผลด้วย Ollama ในเครื่อง</div></div>
 </main>
</div>
<div id="settings" class="settings" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsHeading"><h2 id="settingsHeading">⚙ ตั้งค่า Local AI</h2>
 <label for="host">Ollama Host</label><input class="field" id="host" value="http://localhost:11434">
 <label for="systemPrompt">System Prompt (กำหนดบทบาท AI)</label><textarea class="field" id="systemPrompt" placeholder="คุณเป็นผู้ช่วย AI ที่ตอบภาษาไทย..."></textarea>
 <label for="temperature">Temperature: <span id="tempValue">0.7</span></label><input style="width:100%;accent-color:#21c482" type="range" id="temperature" min="0" max="1.5" step="0.05" value="0.7">
 <label for="numCtx">Context Window (num_ctx)</label><input class="field" id="numCtx" type="number" min="512" max="131072" value="8192">
 <label for="maxHistory">จำนวนข้อความย้อนหลัง (0 = ทั้งหมด)</label><input class="field" id="maxHistory" type="number" min="0" value="20">
 <label class="check"><input type="checkbox" id="think"> เปิดโหมด Thinking (เฉพาะโมเดลที่รองรับ)</label>
 <p class="notice">ข้อมูลแชตบันทึกใน LocalStorage ของเบราว์เซอร์เครื่องนี้ • ใช้กับ Ollama ที่คุณเปิดใช้งานเอง</p>
 <div class="modalfooter"><button class="button" id="cancelSettings">ยกเลิก</button><button class="button primary" id="saveSettings">บันทึก</button></div></div></div>
<script>
'use strict';
const KEY='local-ai-ollama-html-v1';
const $=id=>document.getElementById(id);
const defaults={host:'http://localhost:11434',model:'',systemPrompt:'',temperature:0.7,numCtx:8192,maxHistory:20,think:false};
let state={settings:{...defaults},chats:[],currentId:null};
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object')state={settings:{...defaults,...saved.settings},chats:Array.isArray(saved.chats)?saved.chats:[],currentId:saved.currentId}}catch{}
let active=null,renderTimer=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){setStatus('บันทึกไม่ได้: พื้นที่ LocalStorage ไม่พอ')}}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function newChat(){if(active)return;const chat={id:uid(),title:'แชตใหม่',messages:[],updated:Date.now()};state.chats.unshift(chat);state.currentId=chat.id;save();renderAll();$('prompt').focus();$('sidebar').classList.remove('show')}
function current(){return state.chats.find(c=>c.id===state.currentId)}
function ensureChat(){if(!current()){if(state.chats.length)state.currentId=state.chats[0].id;else newChat()}}
function setStatus(text){$('statusText').textContent=text}
function renderHistory(){const q=$('search').value.trim().toLowerCase();const list=$('history');list.replaceChildren();for(const chat of [...state.chats].sort((a,b)=>b.updated-a.updated)){if(q&&!([chat.title,...chat.messages.map(m=>m.content||'')].join(' ').toLowerCase().includes(q)))continue;const row=document.createElement('div');row.className='historyitem'+(chat.id===state.currentId?' active':'');const select=document.createElement('button');select.textContent='▤  '+chat.title;select.title=chat.title;select.onclick=()=>{if(active)return;state.currentId=chat.id;save();renderAll();$('sidebar').classList.remove('show')};const rename=document.createElement('button');rename.className='iconbtn';rename.title='เปลี่ยนชื่อ';rename.textContent='✎';rename.onclick=()=>{if(active)return;const name=prompt('เปลี่ยนชื่อแชต',chat.title);if(name&&name.trim()){chat.title=name.trim().slice(0,80);chat.updated=Date.now();save();renderAll()}};const del=document.createElement('button');del.className='iconbtn';del.title='ลบแชต';del.textContent='×';del.onclick=()=>{if(active)return;if(!confirm('ลบการสนทนานี้หรือไม่?'))return;state.chats=state.chats.filter(c=>c.id!==chat.id);if(state.currentId===chat.id)state.currentId=state.chats[0]?.id||null;ensureChat();save();renderAll()};row.append(select,rename,del);list.append(row)}}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inlineHTML(s){let t=escapeHTML(s);t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>');t=t.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');t=t.replace(/~~([^~\n]+)~~/g,'<del>$1</del>');t=t.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');return t}
function markdown(s){const lines=String(s||'').split('\n');let out=[],code=[],inCode=false,lang='',list=null;function closeList(){if(list){out.push('</'+list+'>');list=null}};for(const line of lines){const fence=line.match(/^\s*```\s*([\w.+-]*)/);if(fence){closeList();if(inCode){out.push('<pre><code>'+escapeHTML(code.join('\n'))+'</code></pre>');code=[];inCode=false}else{inCode=true;lang=fence[1]}continue}if(inCode){code.push(line);continue}const trim=line.trim();if(!trim){closeList();out.push('');continue}if(/^#{1,3} /.test(trim)){closeList();const n=Math.min(3,trim.match(/^#+/)[0].length)+1;out.push('<h'+n+'>'+inlineHTML(trim.replace(/^#+ /,''))+'</h'+n+'>');continue}if(/^> /.test(trim)){closeList();out.push('<blockquote>'+inlineHTML(trim.slice(2))+'</blockquote>');continue}const item=trim.match(/^([-*]|\d+[.)])\s+(.+)/);if(item){const typ=/\d/.test(item[1][0])?'ol':'ul';if(list!==typ){closeList();out.push('<'+typ+'>');list=typ}out.push('<li>'+inlineHTML(item[2])+'</li>');continue}closeList();if(/^[-*_]{3,}$/.test(trim))out.push('<hr>');else out.push('<p>'+inlineHTML(line)+'</p>')}closeList();if(inCode)out.push('<pre><code>'+escapeHTML(code.join('\n'))+'</code></pre>');return out.join('\n')}
function renderMessages(){const box=$('messages');const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<150;box.replaceChildren();const chat=current();$('chatTitle').textContent=chat?.title||'แชตใหม่';if(!chat?.messages.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<h2>สวัสดีครับ 👋</h2><div>Local AI ของคุณ พร้อมตอบด้วย Ollama บนเครื่องนี้</div><div class="muted" style="margin-top:12px">เลือกโมเดลด้านซ้าย แล้วเริ่มพิมพ์ได้เลย</div>';box.append(empty)}else for(const m of chat.messages){const wrapper=document.createElement('article');wrapper.className='message '+m.role;const header=document.createElement('div');header.className='messageheader';header.textContent=m.role==='user'?'คุณ':'✦ '+(m.model||state.settings.model||'Local AI');wrapper.append(header);if(m.thinking){const details=document.createElement('details');details.className='thought';const summ=document.createElement('summary');summ.textContent=m.streaming?'กำลังคิด...':'แสดง Thinking';const pre=document.createElement('pre');pre.textContent=m.thinking;details.append(summ,pre);wrapper.append(details)}const content=document.createElement('div');content.className='content';if(m.role==='assistant')content.innerHTML=markdown(m.content);else content.textContent=m.content;wrapper.append(content);if(m.role==='assistant'){if(m.stats){const meta=document.createElement('div');meta.className='meta';meta.textContent=`${m.stats.tokens} tokens · ${m.stats.tps.toFixed(1)} tok/s`+(m.interrupted?' · หยุดกลางคัน':'');wrapper.append(meta)}const acts=document.createElement('div');acts.className='messageactions';const copy=document.createElement('button');copy.textContent='⧉ คัดลอก';copy.onclick=async()=>{try{await navigator.clipboard.writeText(m.content||'');copy.textContent='✓ คัดลอกแล้ว'}catch{alert('เบราว์เซอร์ไม่อนุญาตให้คัดลอกอัตโนมัติ')}};acts.append(copy);wrapper.append(acts)}box.append(wrapper)}if(nearBottom)box.scrollTop=box.scrollHeight}
function renderAll(){renderHistory();renderMessages()}
function scheduleRender(){if(renderTimer)return;renderTimer=requestAnimationFrame(()=>{renderTimer=0;renderMessages()})}
function setConnection(ok,txt){$('statusDot').className='dot '+(ok?'ok':'bad');$('connection').textContent=txt}
async function refreshModels(){const select=$('modelSelect');$('refreshModels').disabled=true;try{const res=await fetch(state.settings.host.replace(/\/$/,'')+'/api/tags');if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();const models=(data.models||[]).map(x=>x.name).filter(Boolean);select.replaceChildren();if(!models.length){select.add(new Option('ยังไม่มีโมเดล',''));setConnection(false,'ยังไม่มีโมเดล');return}for(const name of models)select.add(new Option(name,name));if(!models.includes(state.settings.model))state.settings.model=models[0];select.value=state.settings.model;setConnection(true,'เชื่อมต่อแล้ว · '+models.length+' โมเดล');save()}catch(e){setConnection(false,'เชื่อมต่อไม่ได้');select.replaceChildren();select.add(new Option(state.settings.model||'ไม่พบ Ollama',state.settings.model||''));setStatus('เชื่อมต่อ Ollama ไม่ได้ ตรวจว่า Ollama เปิดอยู่ และเบราว์เซอร์ได้รับอนุญาตให้เชื่อมต่อ: '+e.message)}finally{$('refreshModels').disabled=false}}
function finish(){active=null;$('send').textContent='ส่ง ↑';$('send').classList.add('primary');save();renderAll();$('prompt').focus()}
async function sendMessage(regenerate=false){if(active){active.controller.abort();return}const chat=current();if(!chat)return;let userText='';if(regenerate){if(chat.messages.at(-1)?.role==='assistant')chat.messages.pop();if(chat.messages.at(-1)?.role!=='user')return}else{userText=$('prompt').value.trim();if(!userText)return;chat.messages.push({role:'user',content:userText});$('prompt').value='';resizePrompt();if(chat.title==='แชตใหม่')chat.title=userText.replace(/\s+/g,' ').slice(0,42)}if(!state.settings.model){setStatus('ยังไม่มีโมเดล กรุณาติดตั้งโมเดลใน Ollama ก่อน');save();renderAll();return}chat.updated=Date.now();const assistant={role:'assistant',model:state.settings.model,content:'',thinking:'',streaming:true};chat.messages.push(assistant);const controller=new AbortController();active={controller};$('send').textContent='หยุด ■';$('send').classList.remove('primary');renderAll();save();setStatus('AI กำลังสร้างคำตอบ... กดปุ่มหยุดเพื่อยกเลิก');let seen=false;let stats=null;
try{const previous=chat.messages.slice(0,-1).filter(m=>['user','assistant'].includes(m.role)).map(m=>({role:m.role,content:m.content}));const max=Number(state.settings.maxHistory)||0;const history=max>0?previous.slice(-max):previous;const messages=[...(state.settings.systemPrompt.trim()?[{role:'system',content:state.settings.systemPrompt.trim()}]:[]),...history];const body={model:state.settings.model,messages,stream:true,options:{temperature:Number(state.settings.temperature),num_ctx:Number(state.settings.numCtx)}};if(state.settings.think)body.think=true;let response=await fetch(state.settings.host.replace(/\/$/,'')+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});if(!response.ok&&body.think&&[400,422].includes(response.status)){delete body.think;response=await fetch(state.settings.host.replace(/\/$/,'')+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal})}if(!response.ok){let reason='';try{reason=(await response.json()).error}catch{}throw Error(reason||'HTTP '+response.status)}if(!response.body)throw Error('Browser ไม่รองรับ ReadableStream');const reader=response.body.getReader();const decoder=new TextDecoder();let buffer='',thinkingTag=false,tagBuffer='';function feedContent(chunk){tagBuffer+=chunk;while(tagBuffer){const tag=thinkingTag?'</think>':'<think>';const at=tagBuffer.indexOf(tag);if(at>=0){const value=tagBuffer.slice(0,at);assistant[thinkingTag?'thinking':'content']+=value;tagBuffer=tagBuffer.slice(at+tag.length);thinkingTag=!thinkingTag;continue}let hold=0;for(let k=Math.min(tag.length-1,tagBuffer.length);k>0;k--)if(tagBuffer.endsWith(tag.slice(0,k))){hold=k;break}if(tagBuffer.length>hold)assistant[thinkingTag?'thinking':'content']+=tagBuffer.slice(0,tagBuffer.length-hold);tagBuffer=tagBuffer.slice(tagBuffer.length-hold);break}}
function processLine(line){if(!line.trim())return;const obj=JSON.parse(line);if(obj.error)throw Error(obj.error);if(obj.message){assistant.thinking+=obj.message.thinking||'';feedContent(obj.message.content||'')}if(obj.done){seen=true;const n=obj.eval_count||0,d=obj.eval_duration||0;stats={tokens:n,tps:d?n/(d/1e9):0}}scheduleRender()}
while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let idx;while((idx=buffer.indexOf('\n'))!==-1){const line=buffer.slice(0,idx);buffer=buffer.slice(idx+1);processLine(line)}}buffer+=decoder.decode();if(buffer.trim())processLine(buffer);if(tagBuffer)assistant[thinkingTag?'thinking':'content']+=tagBuffer;assistant.stats=stats;if(!seen&&!(assistant.content||assistant.thinking))throw Error('การเชื่อมต่อสิ้นสุดก่อนมีคำตอบ');setStatus('ตอบเสร็จแล้ว • Enter ส่ง • Shift+Enter ขึ้นบรรทัด • Esc หยุด')}
catch(e){if(e.name==='AbortError'){assistant.interrupted=true;setStatus('หยุดการตอบแล้ว')}else{assistant.content+='\n\n⚠ ข้อผิดพลาด: '+e.message;setStatus('เกิดข้อผิดพลาด: '+e.message)}}finally{assistant.streaming=false;finish()}}
function resizePrompt(){const el=$('prompt');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,190)+'px'}
function openSettings(){$('host').value=state.settings.host;$('systemPrompt').value=state.settings.systemPrompt;$('temperature').value=state.settings.temperature;$('tempValue').textContent=state.settings.temperature;$('numCtx').value=state.settings.numCtx;$('maxHistory').value=state.settings.maxHistory;$('think').checked=state.settings.think;$('settings').hidden=false}
function closeSettings(){$('settings').hidden=true}
$('newChat').onclick=newChat;$('refreshModels').onclick=refreshModels;$('modelSelect').onchange=()=>{state.settings.model=$('modelSelect').value;save()};$('search').oninput=renderHistory;$('send').onclick=()=>sendMessage();$('retry').onclick=()=>sendMessage(true);$('prompt').addEventListener('input',resizePrompt);$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(active)active.controller.abort();else closeSettings()}if(e.ctrlKey&&e.key.toLowerCase()==='n'){e.preventDefault();newChat()}});$('settingsBtn').onclick=openSettings;$('cancelSettings').onclick=closeSettings;$('temperature').oninput=()=>$('tempValue').textContent=$('temperature').value;$('saveSettings').onclick=()=>{const host=$('host').value.trim().replace(/\/$/,'');if(!/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(host)){alert('เพื่อความปลอดภัย โปรดใช้ http://localhost:11434 หรือ http://127.0.0.1:11434');return}state.settings={...state.settings,host,systemPrompt:$('systemPrompt').value,temperature:Number($('temperature').value),numCtx:Math.max(512,Number($('numCtx').value)||8192),maxHistory:Math.max(0,Number($('maxHistory').value)||0),think:$('think').checked};save();closeSettings();refreshModels()};$('settings').onclick=e=>{if(e.target===$('settings'))closeSettings()};$('mobileMenu').onclick=()=>$('sidebar').classList.toggle('show');$('export').onclick=()=>{const c=current();if(!c?.messages.length)return;let txt='# '+c.title+'\n\n';for(const m of c.messages)txt+='## '+(m.role==='user'?'คุณ':m.model||'AI')+'\n\n'+(m.content||'')+'\n\n';const blob=new Blob([txt],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ollama-chat-'+new Date().toISOString().slice(0,10)+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
ensureChat();renderAll();resizePrompt();refreshModels();
</script>
